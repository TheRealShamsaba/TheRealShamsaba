<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Arian Shamsabadi — Founder / Full-Stack Developer</title><desc id="desc">An original typographic nameplate with a tilted electric-blue asterisk. Istanbul. Designing, building, figuring it out.</desc><rect x=".5" y=".5" width="999" height="479" rx="3" fill="#F5F3EE" stroke="#C4C4C1"/><text x="43" y="44" font-family="Courier New, monospace" font-size="19" fill="#565A63" letter-spacing="2">THE REAL SHAMSABA</text><text x="825" y="44" font-family="Courier New, monospace" font-size="18" fill="#565A63" >ISTANBUL</text><path d="M43 66H957" stroke="#C4C4C1"/><text x="39" y="222" font-family="Georgia, Times New Roman, serif" font-size="190" fill="#15171B" letter-spacing="-7">Arian</text><text x="39" y="365" font-family="Georgia, Times New Roman, serif" font-size="142" fill="#15171B" letter-spacing="-5">Shamsabadi</text><g transform="translate(843 177) rotate(-12)" fill="#304BFF"><rect x="-86" y="-16" width="172" height="32" rx="1" transform="rotate(0)"/><rect x="-86" y="-16" width="172" height="32" rx="1" transform="rotate(45)"/><rect x="-86" y="-16" width="172" height="32" rx="1" transform="rotate(90)"/><rect x="-86" y="-16" width="172" height="32" rx="1" transform="rotate(135)"/></g><path d="M43 399H957" stroke="#C4C4C1"/><text x="43" y="438" font-family="Courier New, monospace" font-size="21" fill="#15171B" >FOUNDER / FULL-STACK DEVELOPER</text><text x="43" y="462" font-family="Courier New, monospace" font-size="16" fill="#565A63" >Designing, building, figuring it out.</text><path d="M920 429h29v29h-29z" fill="#304BFF"/><path d="m925 453 19-19m-15 0h15v15" fill="none" stroke="#F5F3EE" stroke-width="3"/></svg>
